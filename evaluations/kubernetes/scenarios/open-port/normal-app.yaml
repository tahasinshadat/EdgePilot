apiVersion: apps/v1
kind: Deployment
metadata:
  name: normal-web
  namespace: edgepilot-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: normal-web
  template:
    metadata:
      labels:
        app: normal-web
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: normal-web
  namespace: edgepilot-eval
spec:
  selector:
    app: normal-web
  ports:
    - name: http
      port: 80
      targetPort: 80