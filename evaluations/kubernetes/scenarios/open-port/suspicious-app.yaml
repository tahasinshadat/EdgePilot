apiVersion: apps/v1
kind: Deployment
metadata:
  name: suspicious-miner
  namespace: edgepilot-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suspicious-miner
  template:
    metadata:
      labels:
        app: suspicious-miner
    spec:
      containers:
        - name: worker
          image: nginx:alpine
          ports:
            - name: unexpected
              containerPort: 3333
---
apiVersion: v1
kind: Service
metadata:
  name: suspicious-miner
  namespace: edgepilot-eval
spec:
  selector:
    app: suspicious-miner
  ports:
    - name: unexpected
      port: 3333
      targetPort: 3333