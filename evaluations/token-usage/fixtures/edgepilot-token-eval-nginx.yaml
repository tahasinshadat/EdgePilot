apiVersion: v1
kind: Namespace
metadata:
  name: edgepilot-token-eval
  labels:
    app.kubernetes.io/part-of: edgepilot-evaluation
    edgepilot.io/disposable: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgepilot-token-eval-nginx
  namespace: edgepilot-token-eval
  labels:
    app.kubernetes.io/name: edgepilot-token-eval-nginx
    app.kubernetes.io/part-of: edgepilot-evaluation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgepilot-token-eval-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgepilot-token-eval-nginx
        app.kubernetes.io/part-of: edgepilot-evaluation
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi